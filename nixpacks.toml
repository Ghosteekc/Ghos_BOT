# Do not set providers = ["...", "python"] — that duplicates install/setup
# and the second venv create fails with: Text file busy: /opt/venv/bin/python
# Empty build skips root build.sh (expects local webapp/; frontend is on Vercel).
# "..." keeps Nixpacks Python deps; ffmpeg/ffprobe required for /api/ai/replay/analyze.

[phases.setup]
nixPkgs = ["...", "ffmpeg"]

[phases.build]
cmds = []

[start]
cmd = "python -m bot.main"
